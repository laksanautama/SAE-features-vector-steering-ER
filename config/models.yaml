# ═══════════════════════════════════════════════════════════════
layer_emotion_maps:
  google/gemma-2-2b:
    1: [joy]
    3: [neutral]
    4: [anger]
    13: [disgust]
    22: [fear]
    24: [sadness]
    25: [surprise]

  google/gemma-2-9b:
    3:  [joy, fear, disgust]
    6:  [sadness]
    13: [surprise]
    37: [anger]
    40: [neutral]

  google/gemma-2-9b-it:
    9:  [fear, surprise]
    31: [anger, disgust, neutral, sadness, joy]

  meta-llama/llama-3.1-8b:
    4:  [sadness, fear]
    5:  [neutral]
    13: [disgust]
    14: [joy]
    21: [anger]
    31: [surprise]