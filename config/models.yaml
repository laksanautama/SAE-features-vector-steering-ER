# ═══════════════════════════════════════════════════════════════
# Model & SAE Registry
# ═══════════════════════════════════════════════════════════════

models:
  google/gemma-2-2b:
    d_model: 2304
    n_layers: 26
    use_4bit: false
    default_layer: 7

    sae_widths:
      "16k":
        sae_release: gemma-scope-2b-pt-res-canonical
        sae_id_fmt: "layer_{layer}/width_16k/canonical"
        default_l0: null
        layer_l0: {}
      "65k":
        sae_release: gemma-scope-2b-pt-res
        sae_id_fmt: "layer_{layer}/width_65k/average_l0_{l0}"
        default_l0: 107
        layer_l0:
          1: 121
          6: 107
          7: 107
          8: 111
          11: 70
          19: 115

  google/gemma-2-9b:
    d_model: 3584
    n_layers: 42
    use_4bit: false
    default_layer: 16

    sae_widths:
      "16k":
        sae_release: gemma-scope-9b-pt-res-canonical
        sae_id_fmt: "layer_{layer}/width_16k/canonical"
        default_l0: null
        layer_l0: {}
      "131k":
        sae_release: gemma-scope-9b-pt-res
        sae_id_fmt: "layer_{layer}/width_131k/average_l0_{l0}"
        default_l0: 121
        layer_l0:
          3: 103
          8: 129
          11: 88
          13: 99
          14: 105
          18: 113
          35: 94

  google/gemma-2-9b-it:
    d_model: 3584
    n_layers: 42
    use_4bit: false
    default_layer: 20

    sae_widths:
      "16k":
        sae_release: gemma-scope-9b-it-res
