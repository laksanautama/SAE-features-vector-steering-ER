#javanese language
# ═══════════════════════════════════════════════════════════════
# Model & SAE Registry
# ═══════════════════════════════════════════════════════════════

models:
  google/gemma-2-2b:
    d_model: 2304
    n_layers: 26
    use_4bit: false
    default_layer: 18

    sae_widths:
      "16k":
        sae_release: gemma-scope-2b-pt-res-canonical
        sae_id_fmt: "layer_{layer}/width_16k/canonical"
        default_l0: null
        layer_l0: {}
      "65k":
        sae_release: gemma-scope-2b-pt-res
        sae_id_fmt: "layer_{layer}/width_65k/average_l0_{l0}"
        default_l0: 107
        layer_l0:
          1: 121
          3: 89
          4: 89
          13: 75
          22: 116
          24: 124
          25: 93

  google/gemma-2-9b:
    d_model: 3584
    n_layers: 42
    use_4bit: false
    default_layer: 25

    sae_widths:
      "16k":
        sae_release: gemma-scope-9b-pt-res-canonical
        sae_id_fmt: "layer_{layer}/width_16k/canonical"
        default_l0: null
        layer_l0: {}
      "131k":
        sae_release: gemma-scope-9b-pt-res
        sae_id_fmt: "layer_{layer}/width_131k/average_l0_{l0}"
        default_l0: 121
        layer_l0:
          3: 103
          6: 120
          13: 99
          37: 96
          40: 94


  google/gemma-2-9b-it:
    d_model: 3584
    n_layers: 42
    use_4bit: false
    default_layer: 24

    sae_widths:
      "16k":
        sae_release: gemma-scope-9b-it-res
        sae_id_fmt: "layer_{layer}/width_16k/average_l0_{l0}"
        default_l0: 91
        layer_l0:
          9: 88
          20: 91
          31: 76
      "131k":
        sae_release: gemma-scope-9b-it-res
        sae_id_fmt: "layer_{layer}/width_131k/average_l0_{l0}"
        default_l0: 81
        layer_l0:
          9: 121
          20: 81
          31: 109

  meta-llama/llama-3.1-8b:
    d_model: 4096
    n_layers: 32
    use_4bit: false
    default_layer: 15

    sae_widths:
      "32k":
        sae_release: llama_scope_lxr_8x
        sae_id_fmt: "l{layer}r_8x"
        default_l0: null
        layer_l0: {}
      "131k":
        sae_release: llama_scope_lxr_32x
        sae_id_fmt: "l{layer}r_32x"
        default_l0: null
        layer_l0: {}

