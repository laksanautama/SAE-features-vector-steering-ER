# ═══════════════════════════════════════════════════════════════
# Experiment Configuration
# ═══════════════════════════════════════════════════════════════
# Each script reads this file. Change settings here, not in code.

# ── Models to run experiments on ──────────────────────────────
models:
  - google/gemma-2-2b
  - google/gemma-2-9b
  - google/gemma-2-9b-it
  - meta-llama/llama-3.1-8b

# ── SAE widths to test per model ──────────────────────────────
model_widths:
  google/gemma-2-2b:
    - "16k"
    - "65k"
  google/gemma-2-9b:
    - "16k"
    - "131k"
  google/gemma-2-9b-it:
    - "16k"
    - "131k"
  meta-llama/llama-3.1-8b:
    - "32k"
    - "131k"

# ── Layer modes ───────────────────────────────────────────────
layer_modes:
  - single
  - multi

# ── Candidate selection methods ───────────────────────────────
candidate_methods:
  - semantic-based
  - classifier-based

# ── Output base directory ─────────────────────────────────────
output_dir: ./outputs

# ── HuggingFace token ─────────────────────────────────────────
# Required for gated models (Gemma, Llama) and private datasets.
# Paste your token here, or set the HF_TOKEN env variable instead.
# Env variable takes priority if both are set.
hf_token: YOUR_HF_TOKEN_HERE

# ── GPU / resource settings ───────────────────────────────────
gpu:
  use_4bit: false
  force_4bit_models:
    - google/gemma-2-9b
    - google/gemma-2-9b-it
